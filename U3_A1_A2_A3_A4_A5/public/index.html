<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ec">
    <meta name="description" content="A living notebook for curious minds. Follow the evidence, explore a topic, and keep your research close.">
    <title>Fieldnotes — research, in good company</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell" id="app">
      <aside class="sidebar">
        <a class="brand" href="/" aria-label="Fieldnotes home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>fieldnotes<span class="brand-period">.</span></span>
        </a>
        <div class="sidebar-label">PUBLIC ARCHIVE</div>
        <nav class="primary-nav" aria-label="Main navigation">
          <button class="nav-link is-active" data-view="discover"><span class="nav-icon">⌕</span> Discover</button>
          <button class="nav-link" data-view="saved"><span class="nav-icon">♡</span> My collection <span class="nav-count" id="saved-count">0</span></button>
          <button class="nav-link" data-view="discussions"><span class="nav-icon">◌</span> Discussions</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="note-icon">✳</span>
            <p>A good question is the beginning of every discovery.</p>
            <span class="note-credit">THE FIELDNOTE PROMISE</span>
          </div>
          <div class="sidebar-user"><span class="sidebar-user-copy"><strong>Open archive</strong><small>No account needed</small></span></div>
        </div>
      </aside>

      <main class="main-area" id="main-area" data-theme="history">
        <header class="topbar">
          <div class="breadcrumb"><span>THE RESEARCH DESK</span><span class="breadcrumb-slash">/</span><strong id="current-crumb">Discover</strong></div>
          <div class="topbar-actions">
            <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" aria-label="Search fieldnotes" placeholder="Search the fieldnotes" autocomplete="off"><kbd>⌘ K</kbd></label>
          </div>
        </header>

        <div class="announcement hidden" id="announcement"></div>
        <div id="view-root" class="view-root" aria-live="polite"></div>
        <footer class="site-footer">
          <span>FIELDNOTES <span class="footer-dot">✳</span> A QUIETER KIND OF INTERNET</span>
          <span>Curiosity, with sources.</span>
        </footer>
      </main>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
